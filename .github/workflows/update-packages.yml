name: Update Packages

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update packages
        uses: soker90/aur-maintainer@v1
        with:
          github-token: ${{ secrets.RENOVATE_TOKEN }}
          update-branch: automation/aur-maintainer-updates
          base-branch: master
          auto-merge: true
