name: Update AUR Package

on:
  push:
    branches:
      - master
    paths:
      - 'toolhive-studio-bin/PKGBUILD'
      - 'toolhive-studio-bin/.SRCINFO'
      - 'github-copilot-app-bin/PKGBUILD'
      - 'github-copilot-app-bin/.SRCINFO'
      - 'vega-cli-bin/PKGBUILD'
      - 'vega-cli-bin/.SRCINFO'
  workflow_dispatch:

jobs:
  update-aur:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [toolhive-studio-bin, github-copilot-app-bin, vega-cli-bin]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if package was modified
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^${{ matrix.package }}/"; then
            echo "modified=true" >> $GITHUB_OUTPUT
          else
            echo "modified=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH for AUR
        if: steps.check.outputs.modified == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Configure Git
        if: steps.check.outputs.modified == 'true'
        run: |
          git config --global user.name "Eduardo Parra"
          git config --global user.email "eduparra90@gmail.com"

      - name: Clone AUR repository
        if: steps.check.outputs.modified == 'true'
        run: |
          git clone ssh://aur@aur.archlinux.org/${{ matrix.package }}.git aur-repo

      - name: Update AUR package
        if: steps.check.outputs.modified == 'true'
        run: |
          cp ${{ matrix.package }}/PKGBUILD aur-repo/
          cp ${{ matrix.package }}/.SRCINFO aur-repo/
          cd aur-repo

          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Get version from PKGBUILD
          VERSION=$(grep "^pkgver=" PKGBUILD | cut -d'=' -f2)

          git add PKGBUILD .SRCINFO
          git commit -m "Update to version ${VERSION}"
          git push
