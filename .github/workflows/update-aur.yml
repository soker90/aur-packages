name: Update AUR Package

on:
  push:
    branches:
      - master
    paths:
      - '**/PKGBUILD'
      - '**/.SRCINFO'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
      any_modified: ${{ steps.set-matrix.outputs.any_modified }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect modified packages
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger updates all packages if needed
            DIRS="toolhive-studio-bin github-copilot-app-bin vega-cli-bin"
          else
            # On push, identify which pkg folders were modified
            DIRS=$(git diff --name-only HEAD~1 HEAD | grep -E "PKGBUILD|\.SRCINFO" | xargs -I {} dirname {} | sort -u | xargs)
          fi

          if [ -z "$DIRS" ]; then
            echo "packages=[]" >> $GITHUB_OUTPUT
            echo "any_modified=false" >> $GITHUB_OUTPUT
          else
            JSON_ARRAY=$(echo "$DIRS" | tr ' ' '\n' | jq -R . | jq -s -c .)
            echo "packages=${JSON_ARRAY}" >> $GITHUB_OUTPUT
            echo "any_modified=true" >> $GITHUB_OUTPUT
          fi

  update-aur:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_modified == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup SSH for AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Configure Git
        run: |
          git config --global user.name "Eduardo Parra"
          git config --global user.email "eduparra90@gmail.com"

      - name: Clone AUR repository
        run: |
          git clone ssh://aur@aur.archlinux.org/${{ matrix.package }}.git aur-repo

      - name: Update AUR package
        run: |
          cp ${{ matrix.package }}/PKGBUILD aur-repo/
          cp ${{ matrix.package }}/.SRCINFO aur-repo/
          cd aur-repo

          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Get version from PKGBUILD
          VERSION=$(grep "^pkgver=" PKGBUILD | cut -d'=' -f2)

          git add PKGBUILD .SRCINFO
          git commit -m "Update to version ${VERSION}"
          git push
