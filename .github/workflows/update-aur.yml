name: Update AUR Package

on:
  push:
    branches:
      - master
    paths:
      - '**/PKGBUILD'
      - '**/.SRCINFO'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
      any_modified: ${{ steps.set-matrix.outputs.any_modified }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect modified packages
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PACKAGES_JSON=$(node scripts/detect-packages.mjs --all)
          else
            PACKAGES_JSON=$(node scripts/detect-packages.mjs "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "packages=$PACKAGES_JSON" >> "$GITHUB_OUTPUT"

          if [ "$PACKAGES_JSON" = "[]" ]; then
            echo "any_modified=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_modified=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Detected packages: $PACKAGES_JSON"

  update-aur:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_modified == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup SSH for AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Configure Git
        run: |
          git config --global user.name "Eduardo Parra"
          git config --global user.email "eduparra90@gmail.com"

      - name: Clone AUR repository
        run: |
          git clone ssh://aur@aur.archlinux.org/${{ matrix.package }}.git aur-repo

      - name: Update AUR package
        run: |
          cp ${{ matrix.package }}/PKGBUILD aur-repo/
          cp ${{ matrix.package }}/.SRCINFO aur-repo/
          cd aur-repo

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          VERSION=$(grep "^pkgver=" PKGBUILD | cut -d'=' -f2)

          git add PKGBUILD .SRCINFO
          git commit -m "Update to version ${VERSION}"
          git push
