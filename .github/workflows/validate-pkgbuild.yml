name: Validate PKGBUILD

on:
  pull_request:
    paths:
      - '**/PKGBUILD'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
      any_modified: ${{ steps.set-matrix.outputs.any_modified }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect modified packages
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PACKAGES_JSON=$(node scripts/detect-packages.mjs --all)
          else
            PACKAGES_JSON=$(node scripts/detect-packages.mjs "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "packages=$PACKAGES_JSON" >> "$GITHUB_OUTPUT"

          if [ "$PACKAGES_JSON" = "[]" ]; then
            echo "any_modified=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_modified=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Detected packages: $PACKAGES_JSON"

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_modified == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate PKGBUILD
        run: |
          cd ${{ matrix.package }}
          docker run --rm -v "$PWD:/pkg" archlinux:latest bash -c "
            set -e
            pacman -Syu --noconfirm --needed base-devel namcap
            useradd -m builder
            echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
            chown -R builder:builder /pkg
            cd /pkg
            sudo -u builder namcap PKGBUILD
            sudo -u builder makepkg --printsrcinfo > .SRCINFO.test
            echo 'PKGBUILD validation successful'
          "
          sudo chown -R $(id -u):$(id -g) .

      - name: Check checksums
        run: |
          cd ${{ matrix.package }}
          docker run --rm -v "$PWD:/pkg" archlinux:latest bash -c "
            set -e
            pacman -Syu --noconfirm --needed base-devel
            useradd -m builder
            echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
            chown -R builder:builder /pkg
            cd /pkg
            sudo -u builder makepkg -g
          "
          sudo chown -R $(id -u):$(id -g) .
