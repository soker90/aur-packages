name: Validate PKGBUILD

on:
  pull_request:
    paths:
      - 'toolhive-studio-bin/PKGBUILD'
      - 'github-copilot-app-bin/PKGBUILD'
      - 'vega-cli-bin/PKGBUILD'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [toolhive-studio-bin, github-copilot-app-bin, vega-cli-bin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PKGBUILD
        run: |
          cd ${{ matrix.package }}
          docker run --rm -v "$PWD:/pkg" archlinux:latest bash -c "
            pacman -Syu --noconfirm --needed base-devel namcap
            cd /pkg
            namcap PKGBUILD
            sudo -u nobody makepkg --printsrcinfo > .SRCINFO.test
            echo 'PKGBUILD validation successful'
          "

      - name: Check checksums
        run: |
          cd ${{ matrix.package }}
          docker run --rm -v "$PWD:/pkg" archlinux:latest bash -c "
            pacman -Syu --noconfirm --needed base-devel
            cd /pkg
            sudo -u nobody makepkg -g
          "
