name: Validate Packages

on:
  pull_request:
    paths:
      - '**/PKGBUILD'
      - '**/.SRCINFO'
      - '.github/scripts/validate-package.sh'
      - '.github/scripts/create-automation-pr.sh'
      - '.github/scripts/aur-refresh-metadata.sh'
      - '.github/workflows/detect-vega.yml'
      - '.github/workflows/updpkgsums.yml'
      - 'scripts/detect-packages.mjs'
      - 'scripts/detect-vega-cli.sh'
      - 'scripts/renovate-update-aur-metadata.sh'
      - '.github/workflows/validate-packages.yml'
  push:
    branches:
      - '**'
    paths:
      - '**/PKGBUILD'
      - '**/.SRCINFO'
      - '.github/scripts/validate-package.sh'
      - '.github/scripts/create-automation-pr.sh'
      - '.github/scripts/aur-refresh-metadata.sh'
      - '.github/workflows/detect-vega.yml'
      - '.github/workflows/updpkgsums.yml'
      - 'scripts/detect-packages.mjs'
      - 'scripts/detect-vega-cli.sh'
      - 'scripts/renovate-update-aur-metadata.sh'
      - '.github/workflows/validate-packages.yml'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
      any_modified: ${{ steps.set-matrix.outputs.any_modified }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect packages to validate
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PACKAGES_JSON=$(node scripts/detect-packages.mjs --all)
          else
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            validate_all=false

            while IFS= read -r path; do
              case "$path" in
                .github/scripts/validate-package.sh|.github/scripts/create-automation-pr.sh|.github/scripts/aur-refresh-metadata.sh|.github/workflows/detect-vega.yml|.github/workflows/updpkgsums.yml|scripts/detect-packages.mjs|scripts/detect-vega-cli.sh|scripts/renovate-update-aur-metadata.sh|.github/workflows/validate-packages.yml)
                  validate_all=true
                  break
                  ;;
              esac
            done <<< "$CHANGED_FILES"

            if [ "$validate_all" = "true" ]; then
              PACKAGES_JSON=$(node scripts/detect-packages.mjs --all)
            else
              PACKAGES_JSON=$(node scripts/detect-packages.mjs "$BASE_SHA" "$HEAD_SHA")
            fi
          fi

          echo "packages=$PACKAGES_JSON" >> "$GITHUB_OUTPUT"

          if [ "$PACKAGES_JSON" = "[]" ]; then
            echo "any_modified=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_modified=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Packages to validate: $PACKAGES_JSON"

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_modified == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate package
        run: .github/scripts/validate-package.sh "${{ matrix.package }}"
