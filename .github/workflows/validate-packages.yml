name: Validate AUR packages

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: aur-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build tools
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel git sudo

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Identify changed packages
        id: packages
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git fetch origin "refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-${{ github.event.pull_request.number }}"
          base="origin/${{ github.event.pull_request.base.ref }}"
          head="origin/pr-${{ github.event.pull_request.number }}"
          mapfile -t packages < <(
            git diff --name-only "$base" "$head" |
              awk -F/ 'NF > 1 && $2 == "PKGBUILD" { print $1 }' |
              sort -u
          )
          if (( ${#packages[@]} == 0 )); then
            echo "No package PKGBUILD changes detected."
            echo "packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'packages=%s\n' "$(IFS=,; echo "${packages[*]}")" >> "$GITHUB_OUTPUT"

      - name: Validate changed packages
        if: steps.packages.outputs.packages != ''
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          IFS=, read -r -a packages <<< "${{ steps.packages.outputs.packages }}"
          for package in "${packages[@]}"; do
            echo "::group::Validating $package"
            cd "$GITHUB_WORKSPACE/$package"
            chown -R builder:builder "$GITHUB_WORKSPACE/$package"
            sudo -u builder makepkg --printsrcinfo > .SRCINFO.generated
            diff -u .SRCINFO .SRCINFO.generated
            rm .SRCINFO.generated
            sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild --force
            echo "::endgroup::"
          done
