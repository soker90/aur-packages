name: AUR Maintainer

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}

      - name: Maintain AUR packages
        uses: soker90/aur-maintainer@v1
        with:
          github-token: ${{ secrets.RENOVATE_TOKEN }}
          base-branch: master
          update-branch: update
          auto-merge: true

  publish:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'update/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged repository state
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Select the merged package
        id: package
        env:
          MERGED_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$MERGED_BRANCH" =~ ^update/([A-Za-z0-9@._+-]+)$ ]]; then
            echo "::error::Cannot identify the package from merged branch: $MERGED_BRANCH"
            exit 1
          fi

          package="${BASH_REMATCH[1]}"
          config=".aur-maintainer.yml"
          filtered_config=".aur-maintainer-publish.yml"

          if [[ ! -f "$config" ]]; then
            echo "::error::Missing $config"
            exit 1
          fi

          {
            echo "packages:"
            awk -v package="$package" '
              /^  - path:/ {
                if (found) exit
                found = ($3 == package)
              }
              found { print }
            ' "$config"
          } > "$filtered_config"

          if ! grep -q "^  - path: $package$" "$filtered_config"; then
            echo "::error::Package '$package' is not configured in $config"
            exit 1
          fi

          echo "name=$package" >> "$GITHUB_OUTPUT"
          echo "config=$filtered_config" >> "$GITHUB_OUTPUT"
          echo "Publishing only merged package: $package"

      - name: Resolve AUR known hosts
        id: known-hosts
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'hosts<<EOF'
            ssh-keyscan -H aur.archlinux.org
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish merged package to AUR
        uses: soker90/aur-maintainer@v1
        with:
          config: ${{ steps.package.outputs.config }}
          aur-publish-only: true
          aur-ssh-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          aur-known-hosts: ${{ steps.known-hosts.outputs.hosts }}
