name: AUR Maintainer

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      package:
        description: Exact managed package directory name
        required: true
        type: string
      version:
        description: Target pkgver to prepare for review
        required: true
        type: string
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  maintain:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}

      - name: Maintain AUR packages
        uses: soker90/aur-maintainer@9e48d6f260b3b0b3eec893e597c0fe6945ebdc61
        with:
          github-token: ${{ secrets.RENOVATE_TOKEN }}
          manual-package: ${{ inputs.package }}
          manual-version: ${{ inputs.version }}
          base-branch: master
          update-branch: update
          auto-merge: ${{ github.event_name == 'schedule' }}

  publish:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'update/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged repository state
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Resolve AUR known hosts
        id: known-hosts
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'hosts<<EOF'
            ssh-keyscan -H aur.archlinux.org
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish merged package to AUR
        uses: soker90/aur-maintainer@v1
        with:
          update-branch: update
          aur-publish-only: true
          aur-rewrite-history: true
          aur-publish-branch: ${{ github.event.pull_request.head.ref }}
          aur-ssh-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          aur-known-hosts: ${{ steps.known-hosts.outputs.hosts }}

      - name: Preserve AUR history backups
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aur-history-backups-${{ github.run_id }}
          path: ${{ runner.temp }}/aur-maintainer-aur-backups/*.bundle
          if-no-files-found: ignore
          retention-days: 90
