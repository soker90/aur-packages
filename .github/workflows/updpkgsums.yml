name: Update Package Sums

on:
  pull_request:
    paths:
      - '**/PKGBUILD'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-changes:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
      any_modified: ${{ steps.set-matrix.outputs.any_modified }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect modified packages
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PACKAGES_JSON=$(node scripts/detect-packages.mjs --all)
          else
            PACKAGES_JSON=$(node scripts/detect-packages.mjs "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "packages=$PACKAGES_JSON" >> "$GITHUB_OUTPUT"

          if [ "$PACKAGES_JSON" = "[]" ]; then
            echo "any_modified=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_modified=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Detected packages: $PACKAGES_JSON"

  updpkgsums:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_modified == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Update checksums and .SRCINFO
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            archlinux:latest \
            bash -c "
              set -e
              pacman -Syu --noconfirm --needed base-devel pacman-contrib git sudo

              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              chown -R builder:builder /workspace

              cd /workspace
              sudo -u builder bash .github/scripts/aur-refresh-metadata.sh '${{ matrix.package }}'
            "
          sudo chown -R $(id -u):$(id -g) .

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update checksums and .SRCINFO for ${{ matrix.package }}"
          file_pattern: '${{ matrix.package }}/PKGBUILD ${{ matrix.package }}/.SRCINFO'
          token: ${{ secrets.RENOVATE_TOKEN }}
