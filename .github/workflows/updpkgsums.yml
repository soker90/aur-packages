name: Update Package Sums

on:
  pull_request:
    paths:
      - '**/PKGBUILD'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  updpkgsums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Checkout the pull request branch instead of the merge commit
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Update checksums and .SRCINFO
        run: |
          # Get list of modified directories in this PR
          # On workflow_dispatch or if git diff fails, run on all directories
          MODIFIED_DIRS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MODIFIED_DIRS=$(git diff --name-only HEAD~1 HEAD | grep "PKGBUILD" | xargs -I {} dirname {} | sort -u)
          fi

          if [ -z "$MODIFIED_DIRS" ]; then
            MODIFIED_DIRS="toolhive-studio-bin github-copilot-app-bin"
          fi

          for dir in $MODIFIED_DIRS; do
            if [ -d "$dir" ] && [ -f "$dir/PKGBUILD" ]; then
              echo "==> Processing: $dir"

              # Run updating script using docker archlinux
              docker run --rm \
                -v "$PWD:/workspace" \
                archlinux:latest \
                bash -c "
                  set -e
                  pacman -Syu --noconfirm --needed base-devel pacman-contrib git sudo

                  # Setup builder user with sudo
                  useradd -m builder
                  echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
                  chown -R builder:builder /workspace

                  # Execute updater script as builder
                  cd /workspace
                  sudo -u builder bash .github/scripts/aur-refresh-metadata.sh '$dir'
                "
            fi
          done

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update checksums and .SRCINFO for modified packages"
          file_pattern: '**/PKGBUILD **/.SRCINFO'
