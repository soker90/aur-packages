name: Build and Test Packages

on:
  pull_request:
    paths:
      - '**/PKGBUILD'
  push:
    branches:
      - master
    paths:
      - '**/PKGBUILD'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
      any_modified: ${{ steps.set-matrix.outputs.any_modified }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect modified packages
        id: set-matrix
        run: |
          # Determine the comparison base
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="HEAD~1"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE="HEAD"
          else
            BASE="HEAD~1"
          fi

          # Get list of directories that contain modified PKGBUILDs
          # We check the commits between the base and HEAD
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # For manual run, build all packages
            DIRS="toolhive-studio-bin github-copilot-app-bin vega-cli-bin"
          else
            DIRS=$(git diff --name-only $BASE HEAD | grep "PKGBUILD" | xargs -I {} dirname {} | sort -u | xargs)
          fi

          if [ -z "$DIRS" ]; then
            echo "::log::No package modifications detected."
            echo "packages=[]" >> $GITHUB_OUTPUT
            echo "any_modified=false" >> $GITHUB_OUTPUT
          else
            echo "::log::Modified packages: $DIRS"
            # Format as JSON array: ["pkg1", "pkg2"]
            JSON_ARRAY=$(echo "$DIRS" | tr ' ' '\n' | jq -R . | jq -s -c .)
            echo "packages=${JSON_ARRAY}" >> $GITHUB_OUTPUT
            echo "any_modified=true" >> $GITHUB_OUTPUT
          fi

  build-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_modified == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build package in Arch Linux container
        run: |
          docker run --rm \
            -v "$PWD/${{ matrix.package }}:/pkg" \
            archlinux:latest \
            bash -c "
              set -e

              # Update system and install dependencies
              pacman -Syu --noconfirm --needed base-devel namcap

              # Create non-root user for makepkg
              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              chown -R builder:builder /pkg

              cd /pkg

              # Validate PKGBUILD
              echo '==> Validating PKGBUILD with namcap'
              namcap PKGBUILD

              # Build package
              echo '==> Building package'
              sudo -u builder makepkg -sf --noconfirm

              # Check built package
              echo '==> Validating built package'
              for pkg in *.pkg.tar.zst; do
                if [ -f \"\$pkg\" ]; then
                  namcap \"\$pkg\"
                  echo \"✓ Package built successfully: \$pkg\"
                  ls -lh \"\$pkg\"
                fi
              done

              # Test package installation
              echo '==> Testing package installation'
              pacman -U --noconfirm *.pkg.tar.zst

              echo '==> Package installed successfully'
            "
          # Restore local permissions of files modified by docker
          sudo chown -R $(id -u):$(id -g) .
