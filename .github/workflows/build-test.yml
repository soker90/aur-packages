name: Build and Test Packages

on:
  pull_request:
    paths:
      - '**/PKGBUILD'
  push:
    branches:
      - master
    paths:
      - '**/PKGBUILD'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
      any_modified: ${{ steps.set-matrix.outputs.any_modified }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect modified packages
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PACKAGES_JSON=$(node scripts/detect-packages.mjs --all)
          else
            PACKAGES_JSON=$(node scripts/detect-packages.mjs "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "packages=$PACKAGES_JSON" >> "$GITHUB_OUTPUT"

          if [ "$PACKAGES_JSON" = "[]" ]; then
            echo "any_modified=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_modified=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Detected packages: $PACKAGES_JSON"

  build-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_modified == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build package in Arch Linux container
        run: |
          docker run --rm \
            -v "$PWD/${{ matrix.package }}:/pkg" \
            archlinux:latest \
            bash -c "
              set -e

              pacman -Syu --noconfirm --needed base-devel namcap

              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              chown -R builder:builder /pkg

              cd /pkg

              echo '==> Validating PKGBUILD with namcap'
              namcap PKGBUILD

              echo '==> Building package'
              sudo -u builder makepkg -sf --noconfirm

              echo '==> Validating built package'
              for pkg in *.pkg.tar.zst; do
                if [ -f \"\$pkg\" ]; then
                  namcap \"\$pkg\"
                  echo \"✓ Package built successfully: \$pkg\"
                  ls -lh \"\$pkg\"
                fi
              done

              echo '==> Testing package installation'
              pacman -U --noconfirm *.pkg.tar.zst

              echo '==> Package installed successfully'
            "
          sudo chown -R $(id -u):$(id -g) .
