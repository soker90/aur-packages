name: Detect Vega CLI

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect upstream Vega CLI
        id: detect
        run: |
          scripts/detect-vega-cli.sh | tee /tmp/vega-release
          {
            echo 'version<<EOF'
            sed -n 's/^version=//p' /tmp/vega-release
            echo EOF
            echo 'url<<EOF'
            sed -n 's/^url=//p' /tmp/vega-release
            echo EOF
            echo 'sha256<<EOF'
            sed -n 's/^sha256=//p' /tmp/vega-release
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Check for update
        id: check
        env:
          UPSTREAM_VERSION: ${{ steps.detect.outputs.version }}
          UPSTREAM_SHA256: ${{ steps.detect.outputs.sha256 }}
        run: |
          current_version=$(sed -n 's/^pkgver=//p' vega-cli-bin/PKGBUILD)
          current_sha256=$(sed -n 's/^_sha256="//; s/"$//' vega-cli-bin/PKGBUILD)

          if [[ "$UPSTREAM_VERSION" == "$current_version" && "$UPSTREAM_SHA256" == "$current_sha256" ]]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Vega CLI is already up to date: $current_version"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "Update available: $current_version -> $UPSTREAM_VERSION"
          fi

      - name: Update PKGBUILD
        if: steps.check.outputs.update == 'true'
        env:
          UPSTREAM_VERSION: ${{ steps.detect.outputs.version }}
          UPSTREAM_SHA256: ${{ steps.detect.outputs.sha256 }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=$UPSTREAM_VERSION/" vega-cli-bin/PKGBUILD
          sed -i "s/^_sha256=".*"/_sha256="$UPSTREAM_SHA256"/" vega-cli-bin/PKGBUILD

      - name: Regenerate .SRCINFO
        if: steps.check.outputs.update == 'true'
        run: |
          docker run --rm             -v "$PWD/vega-cli-bin:/pkg"             archlinux:latest             bash -c '
              set -euo pipefail
              pacman -Syu --noconfirm --needed base-devel
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builder:builder /pkg
              cd /pkg
              sudo -u builder makepkg --printsrcinfo > .SRCINFO
            '
          sudo chown -R "$(id -u):$(id -g)" vega-cli-bin

      - name: Create or update pull request
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vega-cli-bin/PKGBUILD vega-cli-bin/.SRCINFO
          git diff --cached --quiet && exit 0

          git commit -m "chore(vega): update CLI to $VERSION"

          branch="automation/vega-cli-update"
          git push --force origin "HEAD:$branch"

          pr=$(gh pr list             --head "$branch"             --base master             --state open             --json number             --jq '.[0].number')

          if [[ -z "$pr" ]]; then
            pr=$(gh pr create               --base master               --head "$branch"               --title "chore(vega): update CLI to $VERSION"               --body "Automated update detected from the official Vega installer.\n\nThe common package validation workflow must pass before merge.")
          else
            gh pr edit "$pr" --title "chore(vega): update CLI to $VERSION"
          fi

          gh pr merge "$pr" --auto --squash
